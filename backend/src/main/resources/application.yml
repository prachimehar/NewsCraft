server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: newscraft
  data:
    mongodb:
      uri: ${MONGODB_URI}

newscraft:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
  news-api:
    base-url: ${NEWS_API_BASE_URL:https://newsapi.org}
    api-key: ${NEWS_API_KEY:}
    timeout: ${NEWS_API_TIMEOUT:5s}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
